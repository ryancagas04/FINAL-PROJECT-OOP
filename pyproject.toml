[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanalyze"
version = "0.1.0"
description = "A beginner-friendly data cleaning and analysis library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Cleanalyze Student Team"}]
dependencies = ["pandas>=1.5", "matplotlib>=3.6"]

[tool.setuptools]
packages = ["cleanalyze"]
